<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d6a"/>
      <stop offset="0.45" stop-color="#0a4695"/>
      <stop offset="0.68" stop-color="#0862aa"/>
      <stop offset="1" stop-color="#01b6ec"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0862aa"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <!-- 実在する境界だけを囲う -->
  <rect x="216" y="58" width="528" height="288" rx="14" fill="none" stroke="#0a4695" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="232" y="82" font-size="13" font-weight="700" fill="#0a4695">AWS アカウント</text>

  <!-- クライアント -->
  <rect x="24" y="148" width="152" height="92" rx="12" fill="#f7f8fa" stroke="#e8e8ee" stroke-width="1.5"/>
  <text x="100" y="184" font-size="16" font-weight="700" fill="#15151a" text-anchor="middle">ブラウザ</text>
  <text x="100" y="208" font-size="12.5" fill="#767680" text-anchor="middle">PC・スマホ</text>

  <!-- CloudFront -->
  <rect x="248" y="148" width="152" height="92" rx="12" fill="#eaf2fb" stroke="#cfe0f2" stroke-width="1.5"/>
  <text x="324" y="180" font-size="15" font-weight="700" fill="#0e0d6a" text-anchor="middle">CloudFront</text>
  <text x="324" y="203" font-size="12" fill="#0a4695" text-anchor="middle">画面を配る</text>
  <text x="324" y="221" font-size="11.5" fill="#767680" text-anchor="middle">東京エッジ</text>

  <!-- Lambda Web Adapter（実際に Jev を呼ぶ主体なので図の重心に置く） -->
  <rect x="464" y="148" width="196" height="92" rx="12" fill="url(#blue)"/>
  <text x="562" y="178" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Lambda</text>
  <text x="562" y="198" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Web Adapter</text>
  <text x="562" y="221" font-size="11.5" fill="#dbeaf5" text-anchor="middle">オレゴン（us-west-2）</text>

  <!-- Parameter Store -->
  <rect x="464" y="268" width="196" height="62" rx="12" fill="#ffffff" stroke="#cfe0f2" stroke-width="1.5"/>
  <text x="562" y="294" font-size="14" font-weight="700" fill="#0e0d6a" text-anchor="middle">Parameter Store</text>
  <text x="562" y="315" font-size="11.5" fill="#767680" text-anchor="middle">API キー（SecureString）</text>

  <!-- TypeSafe 側 -->
  <rect x="792" y="148" width="184" height="92" rx="12" fill="#ffffff" stroke="#8a5a00" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="884" y="180" font-size="15" font-weight="700" fill="#8a5a00" text-anchor="middle">api.typesafe.ai</text>
  <text x="884" y="203" font-size="12" fill="#767680" text-anchor="middle">Jev（System One）</text>
  <text x="884" y="221" font-size="11.5" fill="#767680" text-anchor="middle">米国</text>

  <!-- 矢印。ラベルは線から離して置く -->
  <line x1="176" y1="194" x2="242" y2="194" stroke="#0862aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="209" y="181" font-size="11.5" fill="#767680" text-anchor="middle">機能名</text>

  <line x1="400" y1="194" x2="458" y2="194" stroke="#0862aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="429" y="181" font-size="11.5" fill="#767680" text-anchor="middle">/api</text>

  <line x1="660" y1="194" x2="786" y2="194" stroke="#8a5a00" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="723" y="181" font-size="11.5" fill="#8a5a00" text-anchor="middle">Choice</text>

  <line x1="562" y1="240" x2="562" y2="262" stroke="#0862aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="578" y="258" font-size="11.5" fill="#767680">起動時に1回だけ読む</text>

  <text x="24" y="372" font-size="12" fill="#767680">API キーはブラウザへ渡らない。Jev を呼ぶのは Lambda だけで、画面は結果の確率だけを受け取る。</text>
</svg>
